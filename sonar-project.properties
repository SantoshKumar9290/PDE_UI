# =====================================================
# Project Identification
# =====================================================
sonar.projectKey=PDE_UI
sonar.projectName=PDE_UI
sonar.projectVersion=1.0

# =====================================================
# Source Configuration
# =====================================================
sonar.sources=src,pages
sonar.inclusions=**/*.js,**/*.jsx,**/*.ts,**/*.tsx

# =====================================================
# Exclusions
# =====================================================
sonar.exclusions=node_modules/**,.next/**,build/**,dist/**,coverage/**,public/**

# =====================================================
# Encoding
# =====================================================
sonar.sourceEncoding=UTF-8

# =====================================================
# TypeScript Configuration
# =====================================================
sonar.typescript.tsconfigPath=tsconfig.json

# =====================================================
# SonarQube Server
# =====================================================
sonar.host.url=http://10.10.120.20:9000

# =====================================================
# SECURITY NOTE
# =====================================================
# ❌ DO NOT ADD sonar.login or sonar.token here
# ✅ Authentication is handled by Jenkins
